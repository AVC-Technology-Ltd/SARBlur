[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sarblur"
version = "1.0.0b1"
description = "Free, offline face redaction for CCTV Subject Access Requests"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "AVC Technology Ltd" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "opencv-python>=4.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
# imageio-ffmpeg supplies an FFmpeg when running from source; release builds ship their own.
dev = ["pytest>=8", "imageio-ffmpeg>=0.5", "pyinstaller>=6.10"]

[project.gui-scripts]
sarblur = "sarblur.__main__:entry"

[tool.setuptools]
packages = ["sarblur"]

[tool.setuptools.package-data]
sarblur = ["models/*.onnx", "models/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
